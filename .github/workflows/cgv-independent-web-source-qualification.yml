name: CGV independent web source qualification
on:
  pull_request:
    paths:
      - source_web_probe.py
      - .github/workflows/cgv-independent-web-source-qualification.yml
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install one-shot public HTTP client
        run: python -m pip install "curl_cffi>=0.16,<0.19"
      - name: Observe published CGV timetable; stop on access restrictions
        run: python source_web_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cgv-web-source-evidence
          path: cgv_web_supplier_probe.json
          retention-days: 7
