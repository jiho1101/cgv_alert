name: CGV Independent Source Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "poc_independent_sources.py"
      - ".github/workflows/cgv-independent-source-poc.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python poc_independent_sources.py
