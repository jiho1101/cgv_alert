name: CGV Public Official Route Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cgv-official-route-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe distinct public CGV booking endpoint without browser impersonation
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          root = "https://cgv.co.kr/api/v1/booking/searchMovScnInfo"
          today = datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y%m%d")
          for date in (today, "20261218"):
              qs = urllib.parse.urlencode({
                  "coCd": "A420", "siteNo": "0128",
                  "scnYmd": date, "rtctlScopCd": "08",
              })
              url = root + "?" + qs
              try:
                  request = urllib.request.Request(url, headers={
                      "Accept": "application/json",
                  })
                  with urllib.request.urlopen(request, timeout=12) as response:
                      status = response.status
                      content_type = response.headers.get("Content-Type", "")
                      body = response.read(40960)
              except urllib.error.HTTPError as error:
                  print(f"CGV_PUBLIC_PROBE date={date} status={error.code}")
                  if error.code in (401, 403, 429):
                      print("CGV_PUBLIC_PROBE STOP access denied/rate limited; no retry or alternate source")
                      break
                  print(f"CGV_PUBLIC_PROBE FAIL status={error.code}")
                  break
              except (urllib.error.URLError, TimeoutError) as error:
                  print(f"CGV_PUBLIC_PROBE FAIL date={date} network={type(error).__name__}")
                  break
              print(f"CGV_PUBLIC_PROBE date={date} status={status} content_type={content_type} bytes={len(body)}")
              if status != 200 or "json" not in content_type.lower():
                  break
              try:
                  payload = json.loads(body)
              except (ValueError, UnicodeDecodeError):
                  print("CGV_PUBLIC_PROBE invalid JSON")
                  break
              d = payload.get("data") if isinstance(payload, dict) else None
              if isinstance(d, list):
                  rows = d
              elif isinstance(d, dict):
                  rows = next((v for v in d.values() if isinstance(v, list)), [])
              else:
                  rows = []
              first = rows[0] if rows and isinstance(rows[0], dict) else {}
              print(
                  "CGV_PUBLIC_PROBE_SHAPE "
                  + json.dumps({
                      "date":date,
                      "statusCode":payload.get("statusCode"),
                      "rows":len(rows),
                      "fields":sorted(first.keys())[:25],
                      "sample_theater":first.get("siteNo"),
                      "sample_date":first.get("scnYmd"),
                      "has_seats":("stcnt" in first and ("frSeatCnt" in first or "frtmpSeatCnt" in first)),
                  },ensure_ascii=False)
              )
          PY
