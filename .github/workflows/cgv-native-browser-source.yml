name: CGV native browser public data source qualification
on:
  pull_request:
    paths:
      - probe_browser_public.mjs
      - .github/workflows/cgv-native-browser-source.yml
permissions:
  contents: read
jobs:
  qualify-public-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: One public navigation without access-control evasion
        run: node probe_browser_public.mjs
      - name: Store source qualification only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cgv-native-browser-source-evidence
          path: cgv_browser_source_result.json
          retention-days: 7
