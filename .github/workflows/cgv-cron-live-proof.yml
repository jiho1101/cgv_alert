name: CGV Cron deployed D1 slot proof
# One-shot read-only audit of the actual Cloudflare D1 reservation.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cgv-cron-live-proof.yml"

permissions:
  contents: read

jobs:
  live-d1-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Install HTTP client already used by Production
        run: python -m pip install requests==2.32.5
      - name: Read authenticated Worker Cron reservation (no writes)
        env:
          STATUS_API_TOKEN: ${{ secrets.STATUS_API_TOKEN }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import sys

          import requests
          token = os.getenv("STATUS_API_TOKEN", "")
          if not token:
              print("CRON_LIVE_PROOF FAILURE: existing STATUS_API_TOKEN missing")
              sys.exit(1)
          try:
              res = requests.post(
                  "https://cgv-alert-trigger.choi1101jh.workers.dev/api/runtime-check",
                  headers={"Authorization": "Bearer " + token},
                  json={},
                  timeout=15,
              )
              res.raise_for_status()
              payload = res.json()
          except (requests.RequestException, ValueError) as exc:
              print("CRON_LIVE_PROOF FAILURE: " + type(exc).__name__)
              sys.exit(1)
          dedupe = payload.get("cron_slot_dedupe") or {}
          claimed = dedupe.get("last_claimed_at")
          try:
              instant = datetime.datetime.fromisoformat(
                  str(claimed).replace("Z", "+00:00")
              )
              age = (datetime.datetime.now(datetime.timezone.utc) - instant).total_seconds()
          except (ValueError, TypeError):
              age = None
          print("CRON_LIVE_PROOF " + json.dumps({
              "worker_version": payload.get("version"),
              "enabled": dedupe.get("enabled"),
              "last_slot": dedupe.get("last_claimed_slot"),
              "claim_age_seconds": round(age, 1) if age is not None else None,
              "target_count": (payload.get("emergency_config") or {}).get("target_count"),
              "priority_target_count": (payload.get("emergency_config") or {}).get("eligible_priority_count"),
          }))
          valid = (
              dedupe.get("enabled") is True
              and isinstance(dedupe.get("last_claimed_slot"), int)
              and age is not None and -30 <= age <= 600
          )
          if not valid:
              print("CRON_LIVE_PROOF FAILURE: no recent persisted D1 slot claim")
              sys.exit(1)
          print("CRON_LIVE_PROOF PASS: actual recently claimed Worker slot in shared D1")
          PY
