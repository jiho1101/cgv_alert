name: CGV Status

on:
  workflow_dispatch:

jobs:
  send-status:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests==2.32.5

      - name: Send current monitoring status to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import requests

          KST = ZoneInfo("Asia/Seoul")
          today = datetime.now(KST).strftime("%Y%m%d")
          checked_at = datetime.now(KST).strftime("%Y-%m-%d %H:%M:%S KST")

          def short_date(value):
              value = str(value or "")
              if len(value) == 8 and value.isdigit():
                  return f"{int(value[4:6])}/{int(value[6:8])}"
              return value or "-"

          def current_interval(strategy):
              stages = strategy.get("preopen_stages") or []
              for stage in stages:
                  start = str(stage.get("from", "00000000"))
                  end = str(stage.get("until", "99999999"))
                  if start <= today <= end:
                      return int(stage.get("interval_minutes", 360))
              fast_from = str(strategy.get("fast_mode_from", "99999999"))
              if today >= fast_from:
                  return int(strategy.get("priority_interval_minutes", 15))
              return int(strategy.get("preopen_interval_minutes", 360))

          with open("config.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          targets = [t for t in config.get("targets", []) if t.get("enabled", False)]
          lines = ["📡 현재 활성 감시 타겟", f"확인시각: {checked_at}", ""]

          for index, target in enumerate(targets, start=1):
              date_range = target.get("date_range") or {}
              if date_range:
                  date_text = f"{date_range.get('start')} ~ {date_range.get('end')}"
              else:
                  date_text = str(target.get("date", "-"))

              screens = target.get("screen_keywords") or []
              screen_text = ", ".join(screens) if screens else "전체 상영관"
              strategy = target.get("scan_strategy") or {}

              if strategy:
                  stages = strategy.get("preopen_stages") or []
                  parts = []
                  for stage in stages:
                      parts.append(
                          f"{short_date(stage.get('from'))}~{short_date(stage.get('until'))} "
                          f"{stage.get('interval_minutes')}분"
                      )
                  parts.append(
                      f"{short_date(strategy.get('fast_mode_from'))}부터 우선회차 "
                      f"{strategy.get('priority_interval_minutes', 15)}분"
                  )
                  parts.append(
                      f"전체범위 {strategy.get('full_interval_minutes', 120)}분"
                  )
                  interval_text = " / ".join(parts)
                  current_text = f"현재 적용: {current_interval(strategy)}분"
              else:
                  interval_text = "5분"
                  current_text = "현재 적용: 5분"

              lines.extend([
                  f"[{index}] {target.get('label', target.get('id', '-'))}",
                  f"ID: {target.get('id', '-')}",
                  f"극장: {target.get('theater_name', 'CGV')}",
                  f"날짜: {date_text}",
                  f"상영관: {screen_text}",
                  "시간: 전체 시간",
                  f"감시주기: {interval_text}",
                  current_text,
                  "",
              ])

          lines.append("※ 이 메시지는 수동 상태 확인을 실행했을 때만 전송됩니다.")
          message = "\n".join(lines).strip()

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_URL secret is missing")

          chunks = []
          current = []
          current_len = 0
          for line in message.splitlines():
              size = len(line) + 1
              if current and current_len + size > 1900:
                  chunks.append("\n".join(current))
                  current = []
                  current_len = 0
              current.append(line)
              current_len += size
          if current:
              chunks.append("\n".join(current))

          for chunk in chunks:
              response = requests.post(webhook, json={"content": chunk}, timeout=15)
              if response.status_code not in {200, 204}:
                  raise SystemExit(f"Discord status failed: HTTP {response.status_code}")

          print("Current monitoring status sent")
          PY
