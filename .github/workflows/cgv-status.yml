name: CGV Status

on:
  workflow_dispatch:

jobs:
  send-status:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests==2.32.5

      - name: Send current monitoring status to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import requests

          KST = ZoneInfo("Asia/Seoul")
          today = datetime.now(KST).strftime("%Y%m%d")
          checked_at = datetime.now(KST).strftime("%Y-%m-%d %H:%M:%S KST")

          def short_date(value):
              value = str(value or "")
              if len(value) == 8 and value.isdigit():
                  return f"{int(value[4:6])}/{int(value[6:8])}"
              return value or "-"

          def current_interval(strategy):
              stages = strategy.get("preopen_stages") or []
              for stage in stages:
                  start = str(stage.get("from", "00000000"))
                  end = str(stage.get("until", "99999999"))
                  if start <= today <= end:
                      return int(stage.get("interval_minutes", 360))
              fast_from = str(strategy.get("fast_mode_from", "99999999"))
              if today >= fast_from:
                  return int(strategy.get("priority_interval_minutes", 15))
              return int(strategy.get("preopen_interval_minutes", 360))

          def interval_plan(strategy):
              if not strategy:
                  return "5분"
              parts = []
              for stage in strategy.get("preopen_stages") or []:
                  parts.append(
                      f"{short_date(stage.get('from'))}~{short_date(stage.get('until'))}: "
                      f"{stage.get('interval_minutes')}분"
                  )
              parts.append(
                  f"{short_date(strategy.get('fast_mode_from'))}부터 핵심 회차: "
                  f"{strategy.get('priority_interval_minutes', 15)}분"
              )
              parts.append(
                  f"전체 범위 보조 확인: {strategy.get('full_interval_minutes', 120)}분"
              )
              return "\n".join(parts)

          with open("config.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          targets = [t for t in config.get("targets", []) if t.get("enabled", False)]
          embeds = []

          for target in targets:
              date_range = target.get("date_range") or {}
              if date_range:
                  date_text = f"{date_range.get('start')} ~ {date_range.get('end')}"
              else:
                  date_text = str(target.get("date", "-"))

              screens = target.get("screen_keywords") or []
              screen_text = ", ".join(screens) if screens else "전체 상영관"
              strategy = target.get("scan_strategy") or {}
              current_text = (
                  f"{current_interval(strategy)}분"
                  if strategy else "5분"
              )

              embeds.append({
                  "title": f"🎬 {target.get('label', target.get('id', '-'))}",
                  "description": f"`{target.get('id', '-')}`",
                  "fields": [
                      {"name": "극장", "value": target.get("theater_name", "CGV"), "inline": True},
                      {"name": "현재 적용", "value": current_text, "inline": True},
                      {"name": "감시 날짜", "value": date_text, "inline": False},
                      {"name": "상영관 / 시간", "value": f"{screen_text} / 전체 시간", "inline": False},
                      {"name": "감시 계획", "value": interval_plan(strategy)[:1024], "inline": False},
                  ],
                  "footer": {"text": f"현재 활성 감시 타겟 · {checked_at}"},
              })

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_URL secret is missing")

          if not embeds:
              payloads = [{"content": "현재 활성화된 CGV 감시 타겟이 없습니다."}]
          else:
              payloads = []
              for i in range(0, len(embeds), 10):
                  payload = {"embeds": embeds[i:i + 10]}
                  if i == 0:
                      payload["content"] = "📡 **현재 활성 감시 타겟**"
                  payloads.append(payload)

          for payload in payloads:
              response = requests.post(webhook, json=payload, timeout=15)
              if response.status_code not in {200, 204}:
                  raise SystemExit(f"Discord status failed: HTTP {response.status_code}")

          print("Current monitoring status embeds sent")
          PY