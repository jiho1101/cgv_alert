name: CGV historical 502 future-date transition (one shot)
on:
  push:
    branches: [research/future-publication-real-world-20261101]
    paths: [.github/workflows/cgv-one-shot-502-transition-20261101.yml]
permissions:
  contents: read
jobs:
  compare-now-to-20261028:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests for read-only third-party timetable check
        run: python -m pip install requests==2.32.5
      - name: Check if previous 502 dates now return actual rows (no CGV direct calls)
        run: |
          python - <<'PY'
          import json
          import requests
          from shadow_public_monitor import canonical, extract_rows, inspect_rows, structural_valid

          base = "https://mcp.aka.page/api/cgv/timetable"
          known_oct28 = {"20261101": 200, "20261102": 502, "20261108": 502}
          results = []
          for date in ("20261101", "20261102", "20261103", "20261108"):
              try:
                  resp = requests.get(
                      base,
                      params={"playDate": date, "theaterCode": "0128", "limit": 200},
                      headers={"Accept": "application/json"},
                      timeout=12,
                  )
                  try:
                      obj = resp.json()
                  except ValueError:
                      obj = None
                  raw, shape = extract_rows(obj)
                  rows = [c for c in (canonical(item) for item in raw) if c]
                  inspection = inspect_rows(rows)
                  valid = structural_valid(resp.status_code, None, shape, inspection)
                  valid_identity = all(
                      row.get("theater_code") == "0128" and row.get("play_date") == date
                      for row in rows
                  )
                  positive_seat_rows = 0
                  for row in rows:
                      try:
                          total = int(row.get("total_seats"))
                          remain = int(row.get("remaining_seats"))
                          if total > 0 and 0 < remain <= total:
                              positive_seat_rows += 1
                      except (ValueError, TypeError):
                          pass
                  evidence = {
                      "date": date, "http": resp.status_code,
                      "rows": len(rows), "valid_structure": bool(valid and valid_identity),
                      "bookable_rows": positive_seat_rows,
                      "historical_oct28_http": known_oct28.get(date),
                  }
              except requests.RequestException as e:
                  evidence = {"date": date, "error": type(e).__name__}
              results.append(evidence)
              print("SOURCE_PUBLICATION_EVIDENCE " + json.dumps(evidence))
          print("HISTORICAL_502_TO_200_WITH_ROWS " + json.dumps([
              row["date"] for row in results
              if row.get("historical_oct28_http") == 502
              and row.get("http") == 200
              and row.get("valid_structure") and row.get("bookable_rows",0) > 0
          ]))
          PY

      - name: Verify production parser accepts real opened sessions and deduplicates seat changes
        run: |
          python - <<'PY'
          import json
          import copy
          import requests
          from checker import extract_public_sessions
          from shadow_public_monitor import canonical, extract_rows

          day = "20261102"
          response = requests.get(
              "https://mcp.aka.page/api/cgv/timetable",
              params={"playDate": day, "theaterCode": "0128", "limit": 200},
              timeout=12,
          )
          try:
              data = response.json()
          except ValueError:
              data = None
          raw, shape = extract_rows(data)
          rows = [r for r in (canonical(x) for x in raw) if r]
          eligible = []
          for r in rows:
              try:
                  seats = int(r.get("remaining_seats"))
                  total = int(r.get("total_seats"))
                  if (r.get("movie_name") and r.get("movie_code")
                      and seats > 0 and total >= seats):
                      eligible.append(r)
              except (TypeError, ValueError):
                  pass
          if response.status_code != 200 or not shape or not eligible:
              print("LIVE_PRODUCTION_PARSER UNAVAILABLE: no actual published sessions in this observation")
              raise SystemExit(1)
          sample = eligible[0]
          target = {
              "theater_code": "0128",
              "id": "isolated-read-only-demo",
              "movie_aliases": [sample["movie_name"]],
              "require_sale_open": True,
              "min_remaining_seats": 1,
          }
          sessions = extract_public_sessions(rows, target, day)
          keys = {r["_key"] for r in sessions}
          modified = copy.deepcopy(rows)
          for r in modified:
              if r.get("remaining_seats") is not None:
                  try:
                      r["remaining_seats"] = max(1, int(r["remaining_seats"]) - 1)
                  except (TypeError, ValueError):
                      pass
          after_seat_change = extract_public_sessions(modified, target, day)
          modified_keys = {r["_key"] for r in after_seat_change}
          print("LIVE_PRODUCTION_PARSER " + json.dumps({
              "http_status": response.status_code,
              "real_row_count": len(rows),
              "sample_movie_name": sample["movie_name"],
              "accepted_for_matching_movie": len(sessions),
              "stable_keys": len(keys),
              "seat_only_keys_unchanged": bool(keys and keys == modified_keys),
              "discord_sent": False,
              "state_modified": False,
          }, ensure_ascii=False))
          assert len(sessions) > 0
          assert len(keys) == len(sessions)
          assert keys == modified_keys
          print("LIVE_PRODUCTION_PARSER PASS")
          PY
