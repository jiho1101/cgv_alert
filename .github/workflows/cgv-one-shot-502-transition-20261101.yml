name: CGV historical 502 future-date transition (one shot)
on:
  push:
    branches: [research/future-publication-real-world-20261101]
    paths: [.github/workflows/cgv-one-shot-502-transition-20261101.yml]
permissions:
  contents: read
jobs:
  compare-now-to-20261028:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests for read-only third-party timetable check
        run: python -m pip install requests==2.32.5
      - name: Check if previous 502 dates now return actual rows (no CGV direct calls)
        run: |
          python - <<'PY'
          import json
          import requests
          from shadow_public_monitor import canonical, extract_rows, inspect_rows, structural_valid

          base = "https://mcp.aka.page/api/cgv/timetable"
          known_oct28 = {"20261101": 200, "20261102": 502, "20261108": 502}
          results = []
          for date in ("20261101", "20261102", "20261103", "20261108"):
              try:
                  resp = requests.get(
                      base,
                      params={"playDate": date, "theaterCode": "0128", "limit": 200},
                      headers={"Accept": "application/json"},
                      timeout=12,
                  )
                  try:
                      obj = resp.json()
                  except ValueError:
                      obj = None
                  raw, shape = extract_rows(obj)
                  rows = [c for c in (canonical(item) for item in raw) if c]
                  inspection = inspect_rows(rows)
                  valid = structural_valid(resp.status_code, None, shape, inspection)
                  valid_identity = all(
                      row.get("theater_code") == "0128" and row.get("play_date") == date
                      for row in rows
                  )
                  positive_seat_rows = 0
                  for row in rows:
                      try:
                          total = int(row.get("total_seats"))
                          remain = int(row.get("remaining_seats"))
                          if total > 0 and 0 < remain <= total:
                              positive_seat_rows += 1
                      except (ValueError, TypeError):
                          pass
                  evidence = {
                      "date": date, "http": resp.status_code,
                      "rows": len(rows), "valid_structure": bool(valid and valid_identity),
                      "bookable_rows": positive_seat_rows,
                      "historical_oct28_http": known_oct28.get(date),
                  }
              except requests.RequestException as e:
                  evidence = {"date": date, "error": type(e).__name__}
              results.append(evidence)
              print("SOURCE_PUBLICATION_EVIDENCE " + json.dumps(evidence))
          print("HISTORICAL_502_TO_200_WITH_ROWS " + json.dumps([
              row["date"] for row in results
              if row.get("historical_oct28_http") == 502
              and row.get("http") == 200
              and row.get("valid_structure") and row.get("bookable_rows",0) > 0
          ]))
          PY
