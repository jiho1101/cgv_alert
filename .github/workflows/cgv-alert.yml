name: CGV Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "checker.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/cgv-alert.yml"

permissions:
  contents: write

concurrency:
  group: cgv-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile checker.py

      - name: Discord webhook test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[discord-test]')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is missing"
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"content":"✅ CGV 알리미 테스트 성공 — Discord Webhook이 정상 연결되었습니다."}' \
            "$DISCORD_WEBHOOK_URL")
          if [ "$status" != "204" ] && [ "$status" != "200" ]; then
            echo "Discord test failed with HTTP $status"
            exit 1
          fi
          echo "Discord test message sent successfully"

      - name: Self-test CGV public timetable API
        if: github.event_name == 'push'
        run: python checker.py --self-test

      - name: Check configured alerts
        run: python checker.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save notification state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update CGV alert state [skip ci]"
          git push
