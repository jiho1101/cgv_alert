name: CGV Alert

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "checker.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/cgv-alert.yml"

permissions:
  contents: write

concurrency:
  group: cgv-alert-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile checker.py

      - name: Apply staged monitoring intervals
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = "config.json"
          with open(path, "r", encoding="utf-8") as f:
              config = json.load(f)

          today = datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y%m%d")
          changed = []
          for target in config.get("targets", []):
              strategy = target.get("scan_strategy") or {}
              stages = strategy.get("preopen_stages") or []
              for stage in stages:
                  start = str(stage.get("from", "00000000"))
                  end = str(stage.get("until", "99999999"))
                  if start <= today <= end:
                      interval = int(stage["interval_minutes"])
                      strategy["preopen_interval_minutes"] = interval
                      changed.append(f"{target.get('id')}: {interval}분")
                      break

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("현재 단계:", ", ".join(changed) if changed else "fast mode 또는 기본 설정")
          PY

      - name: Self-test CGV public timetable API
        if: github.event_name == 'push'
        run: python checker.py --self-test

      - name: Check configured alerts
        run: python checker.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save monitoring state and target cleanup
        run: |
          if git diff --quiet -- state.json config.json; then
            echo "No monitoring state or target changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json config.json
          git commit -m "chore: update CGV monitoring state [skip ci]"
          git push
