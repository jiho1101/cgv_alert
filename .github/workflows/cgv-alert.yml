name: CGV Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "checker.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/cgv-alert.yml"

permissions:
  contents: write

concurrency:
  group: cgv-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile checker.py

      - name: Apply staged monitoring intervals
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = "config.json"
          with open(path, "r", encoding="utf-8") as f:
              config = json.load(f)

          today = datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y%m%d")
          changed = []
          for target in config.get("targets", []):
              strategy = target.get("scan_strategy") or {}
              stages = strategy.get("preopen_stages") or []
              for stage in stages:
                  start = str(stage.get("from", "00000000"))
                  end = str(stage.get("until", "99999999"))
                  if start <= today <= end:
                      interval = int(stage["interval_minutes"])
                      strategy["preopen_interval_minutes"] = interval
                      changed.append(f"{target.get('id')}: {interval}분")
                      break

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("현재 단계:", ", ".join(changed) if changed else "fast mode 또는 기본 설정")
          PY

      - name: Self-test CGV public timetable API
        if: github.event_name == 'push'
        run: python checker.py --self-test

      - name: Check configured alerts
        run: python checker.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send active target summary
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if git diff --quiet -- state.json; then
            echo "No alert was sent; target summary skipped"
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import requests

          def short_date(value):
              value = str(value or "")
              if len(value) == 8 and value.isdigit():
                  return f"{int(value[4:6])}/{int(value[6:8])}"
              return value or "-"

          with open("config.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          targets = [t for t in config.get("targets", []) if t.get("enabled", False)]
          lines = ["📡 현재 활성 감시 타겟", ""]

          for index, target in enumerate(targets, start=1):
              date_range = target.get("date_range") or {}
              if date_range:
                  date_text = f"{date_range.get('start')} ~ {date_range.get('end')}"
              else:
                  date_text = str(target.get("date", "-"))

              screens = target.get("screen_keywords") or []
              screen_text = ", ".join(screens) if screens else "전체 상영관"

              strategy = target.get("scan_strategy") or {}
              if strategy:
                  stages = strategy.get("preopen_stages") or []
                  if stages:
                      parts = []
                      for stage in stages:
                          parts.append(
                              f"{short_date(stage.get('from'))}~{short_date(stage.get('until'))} "
                              f"{stage.get('interval_minutes')}분"
                          )
                      parts.append(
                          f"{short_date(strategy.get('fast_mode_from'))}부터 우선회차 "
                          f"{strategy.get('priority_interval_minutes', 15)}분"
                      )
                      parts.append(
                          f"전체범위 {strategy.get('full_interval_minutes', 120)}분"
                      )
                      interval_text = " / ".join(parts)
                  else:
                      interval_text = (
                          f"사전 {strategy.get('preopen_interval_minutes', 360)}분 / "
                          f"우선기간 {strategy.get('priority_interval_minutes', 15)}분 / "
                          f"전체 {strategy.get('full_interval_minutes', 120)}분"
                      )
              else:
                  interval_text = "5분"

              lines.extend([
                  f"[{index}] {target.get('label', target.get('id', '-'))}",
                  f"ID: {target.get('id', '-')}",
                  f"극장: {target.get('theater_name', 'CGV')}",
                  f"날짜: {date_text}",
                  f"상영관: {screen_text}",
                  "시간: 전체 시간",
                  f"감시주기: {interval_text}",
                  "",
              ])

          lines.append("수정할 때 위 ID를 말해주면 해당 타겟을 정확히 변경할 수 있습니다.")
          message = "\n".join(lines).strip()
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_URL secret is missing")

          chunks = []
          current = []
          current_len = 0
          for line in message.splitlines():
              size = len(line) + 1
              if current and current_len + size > 1900:
                  chunks.append("\n".join(current))
                  current = []
                  current_len = 0
              current.append(line)
              current_len += size
          if current:
              chunks.append("\n".join(current))

          for chunk in chunks:
              response = requests.post(webhook, json={"content": chunk}, timeout=15)
              if response.status_code not in {200, 204}:
                  raise SystemExit(f"Discord target summary failed: HTTP {response.status_code}")

          print("Active target summary sent")
          PY

      - name: Save notification state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update CGV alert state [skip ci]"
          git push
