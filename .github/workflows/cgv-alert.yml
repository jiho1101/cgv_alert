name: CGV Alert

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Who requested this run"
        required: false
        default: "manual"
        type: string
  push:
    branches:
      - main
    paths:
      - "checker.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/cgv-alert.yml"

permissions:
  contents: write

concurrency:
  group: cgv-alert-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest monitoring state
        run: |
          git fetch origin main
          if git cat-file -e origin/main:state.json 2>/dev/null; then
            git show origin/main:state.json > state.json
            echo "Latest state.json synced from main"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile checker.py

      - name: Apply staged monitoring intervals
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = "config.json"
          with open(path, "r", encoding="utf-8") as f:
              config = json.load(f)

          today = datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y%m%d")
          changed = []
          for target in config.get("targets", []):
              strategy = target.get("scan_strategy") or {}
              stages = strategy.get("preopen_stages") or []
              for stage in stages:
                  start = str(stage.get("from", "00000000"))
                  end = str(stage.get("until", "99999999"))
                  if start <= today <= end:
                      interval = int(stage["interval_minutes"])
                      strategy["preopen_interval_minutes"] = interval
                      changed.append(f"{target.get('id')}: {interval}분")
                      break

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("현재 단계:", ", ".join(changed) if changed else "fast mode 또는 기본 설정")
          PY

      - name: Self-test CGV public timetable API
        if: github.event_name == 'push'
        continue-on-error: true
        run: python checker.py --self-test

      - name: Check configured alerts
        run: python checker.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_ALL_CGV_DATES: ${{ github.event_name == 'workflow_dispatch' && inputs.source == 'discord_manual' && '1' || '0' }}

      - name: Report runtime status to Cloudflare
        if: always()
        env:
          STATUS_API_TOKEN: ${{ secrets.STATUS_API_TOKEN }}
          STATUS_API_URL: "https://cgv-alert-trigger.choi1101jh.workers.dev/api/status"
        run: |
          if [ -z "$STATUS_API_TOKEN" ]; then
            echo "STATUS_API_TOKEN secret is not configured yet; skipping status sync."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import requests

          path = Path("runtime_status.json")
          if path.exists():
              payload = json.loads(path.read_text(encoding="utf-8"))
          else:
              payload = {
                  "last_run_at": datetime.now(ZoneInfo("Asia/Seoul")).isoformat(),
                  "health_summary": "error",
                  "recent_error": "runtime_status.json이 생성되지 않았습니다.",
                  "targets": [],
                  "preserve_targets": True,
              }

          try:
              response = requests.post(
                  os.environ["STATUS_API_URL"],
                  json=payload,
                  headers={
                      "Authorization": f"Bearer {os.environ['STATUS_API_TOKEN']}"
                  },
                  timeout=15,
              )
              if response.status_code not in {200, 204}:
                  print(
                      "Cloudflare 상태 동기화 경고:",
                      response.status_code,
                      response.text[:500],
                  )
              else:
                  print("Cloudflare 상태 동기화 완료")
          except requests.RequestException as exc:
              print(f"Cloudflare 상태 동기화 경고: {type(exc).__name__}: {exc}")
          PY

      - name: Notify Discord when instant check finishes
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.source == 'discord_manual' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import requests

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              print("DISCORD_WEBHOOK_URL secret is missing; skipping completion message.")
              raise SystemExit(0)

          path = Path("runtime_status.json")
          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
          else:
              data = {
                  "health_summary": "error",
                  "recent_error": "runtime_status.json이 생성되지 않았습니다.",
                  "active_count": 0,
                  "targets": [],
              }

          health = data.get("health_summary", "normal")
          if health == "error":
              label = "🔴 오류"
              color = 0xE74C3C
          elif health == "warning":
              label = "🟡 일부 확인 필요"
              color = 0xF1C40F
          else:
              label = "🟢 정상 완료"
              color = 0x2ECC71

          now = datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y-%m-%d %H:%M:%S KST")
          recent_error = data.get("recent_error") or "없음"
          targets = data.get("targets") or []
          active_count = data.get("active_count", len(targets))

          result_lines = []
          for target in targets:
              target_health = target.get("health_status", "normal")
              icon = (
                  "🔴" if target_health == "error"
                  else "🟡" if target_health == "warning"
                  else "🟢"
              )
              sessions = int(target.get("available_session_count") or 0)
              mode = target.get("detection_mode", "structured")
              if mode == "fallback":
                  session_text = (
                      f"보조 감지 후보 {sessions}개 · 앱/웹 확인 필요"
                      if sessions
                      else "보조 감지 사용 · 후보 미감지"
                  )
              elif mode == "failed":
                  session_text = "이번 회차 확인 실패 · 다음 5분 재시도"
              elif mode == "not_checked":
                  session_text = "이번 실행에서 조회 대상 아님"
              else:
                  session_text = (
                      f"현재 예매 회차 {sessions}개"
                      if sessions
                      else "예매 회차 미감지"
                  )
              result_lines.append(
                  f"{icon} **{target.get('label', target.get('id', '영화'))}** — {session_text}"
              )

          result_text = "\n".join(result_lines) or "활성 감시 대상이 없습니다."

          payload = {
              "embeds": [{
                  "title": "🔎 CGV 즉시확인 완료",
                  "description": f"**{label}**",
                  "color": color,
                  "fields": [
                      {"name": "완료 시각", "value": now, "inline": True},
                      {"name": "활성 감시", "value": f"{active_count}개", "inline": True},
                      {
                          "name": "조회 방식",
                          "value": "주기 무시 · 활성 감시 대상의 전체 설정 날짜 강제 조회",
                          "inline": False,
                      },
                      {
                          "name": "감시 결과",
                          "value": result_text[:1024],
                          "inline": False,
                      },
                      {"name": "최근 오류", "value": str(recent_error)[:1000], "inline": False},
                  ],
                  "footer": {
                      "text": "새 예매 오픈이 감지되면 기존 예매 오픈 알림이 별도로 전송됩니다."
                  },
              }]
          }

          try:
              response = requests.post(webhook, json=payload, timeout=15)
              if response.status_code not in {200, 204}:
                  print(
                      "Discord completion notice failed:",
                      response.status_code,
                      response.text[:500],
                  )
              else:
                  print("Discord instant-check completion notice sent")
          except requests.RequestException as exc:
              print(
                  f"Discord completion notice warning: {type(exc).__name__}: {exc}"
              )
          PY

      - name: Save monitoring state and target cleanup
        run: |
          if git diff --quiet -- state.json config.json; then
            echo "No monitoring state or target changes"
            exit 0
          fi

          cp state.json /tmp/local_state.json
          cp config.json /tmp/local_config.json
          git show HEAD:config.json > /tmp/base_config.json

          cat > /tmp/merge_monitoring.py <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path

          def load(path, default):
              p = Path(path)
              if not p.exists():
                  return deepcopy(default)
              return json.loads(p.read_text(encoding="utf-8"))

          def save(path, data):
              Path(path).write_text(
                  json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          def int_version(value):
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return 1

          def merge_key_lists(remote_map, local_map):
              out = {}
              for key in set(remote_map) | set(local_map):
                  merged = set(remote_map.get(key) or [])
                  merged.update(local_map.get(key) or [])
                  if merged:
                      out[key] = sorted(merged)[-1000:]
              return out

          remote_state = load("state.json", {"version": 2})
          local_state = load("/tmp/local_state.json", {"version": 2})

          remote_version = int_version(remote_state.get("version"))
          local_version = int_version(local_state.get("version"))

          if local_version >= 2 and remote_version < 2:
              merged_state = deepcopy(local_state)
          else:
              merged_state = deepcopy(remote_state)
              for key, value in local_state.items():
                  if key not in {"seen", "fallback_seen", "health"}:
                      merged_state[key] = deepcopy(value)
              merged_state["version"] = max(remote_version, local_version)
              merged_state["seen"] = merge_key_lists(
                  remote_state.get("seen") or {},
                  local_state.get("seen") or {},
              )
              merged_state["fallback_seen"] = merge_key_lists(
                  remote_state.get("fallback_seen") or {},
                  local_state.get("fallback_seen") or {},
              )
              # This run started after syncing the latest state, so its health
              # snapshot is the newest view and already contains prior incidents.
              merged_state["health"] = deepcopy(
                  local_state.get("health", remote_state.get("health", {}))
              )

          save("state.json", merged_state)

          base_config = load("/tmp/base_config.json", {"targets": []})
          local_config = load("/tmp/local_config.json", {"targets": []})
          remote_config = load("config.json", {"targets": []})

          base_map = {
              str(t.get("id")): t
              for t in base_config.get("targets", [])
              if t.get("id") is not None
          }
          local_map = {
              str(t.get("id")): t
              for t in local_config.get("targets", [])
              if t.get("id") is not None
          }
          remote_targets = list(remote_config.get("targets", []))
          remote_map = {
              str(t.get("id")): t
              for t in remote_targets
              if t.get("id") is not None
          }

          removed_ids = set(base_map) - set(local_map)
          changed_ids = {
              target_id
              for target_id in set(base_map) & set(local_map)
              if base_map[target_id] != local_map[target_id]
          }
          added_ids = set(local_map) - set(base_map)

          merged_targets = []
          for target in remote_targets:
              target_id = str(target.get("id"))
              if target_id in removed_ids:
                  if remote_map.get(target_id) == base_map.get(target_id):
                      continue
                  print(
                      f"Config changed remotely for {target_id}; "
                      "keeping remote target instead of auto-removing it"
                  )
              if target_id in changed_ids:
                  if remote_map.get(target_id) == base_map.get(target_id):
                      merged_targets.append(deepcopy(local_map[target_id]))
                      continue
                  print(
                      f"Config changed remotely for {target_id}; "
                      "keeping remote version"
                  )
              merged_targets.append(target)

          present = {
              str(t.get("id"))
              for t in merged_targets
              if t.get("id") is not None
          }
          for target_id in added_ids:
              if target_id not in present:
                  merged_targets.append(deepcopy(local_map[target_id]))

          remote_config["targets"] = merged_targets

          if local_config.get("request") != base_config.get("request"):
              if remote_config.get("request") == base_config.get("request"):
                  remote_config["request"] = deepcopy(local_config.get("request"))
              else:
                  print("Config request changed remotely; keeping remote version")

          Path("config.json").write_text(
              json.dumps(remote_config, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "State save attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            python /tmp/merge_monitoring.py

            if git diff --quiet -- state.json config.json; then
              echo "Latest main already contains the monitoring changes"
              exit 0
            fi

            git add state.json config.json
            git commit -m "chore: update CGV monitoring state [skip ci]"

            if git push origin HEAD:main; then
              echo "Monitoring state saved"
              exit 0
            fi

            echo "Main changed during save; retrying semantic merge"
          done

          echo "Failed to save monitoring state after 3 attempts"
          exit 1
