name: CGV Discord E2E Once

on:
  push:
    branches:
      - main
    paths:
      - "checker.py"
      - ".github/workflows/cgv-discord-e2e-once.yml"

permissions:
  contents: read

jobs:
  discord-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile checker.py shadow_public_monitor.py

      - name: Send clearly labeled Discord E2E test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python checker.py --discord-e2e-test
