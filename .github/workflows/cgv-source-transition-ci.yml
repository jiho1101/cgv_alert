name: CGV source publication transition CI
on:
  push:
    branches: [main, feature/source-opening-transition-canary-20261101]
    paths:
      - source_transition_canary.py
      - test_source_transition_canary.py
      - .github/workflows/cgv-source-transition-ci.yml
  pull_request:
    paths:
      - source_transition_canary.py
      - test_source_transition_canary.py
      - .github/workflows/cgv-source-transition-ci.yml
permissions:
  contents: read
jobs:
  transition-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - run: python -m unittest -v test_source_transition_canary.py
      - run: python -m py_compile source_transition_canary.py
