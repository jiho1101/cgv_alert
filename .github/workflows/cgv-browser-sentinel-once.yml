name: CGV Cloudflare Browser one-shot sentinel
# Diagnostic runs only after a change to THIS workflow, no schedule/Discord.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cgv-browser-sentinel-once.yml"

permissions:
  contents: read

jobs:
  one-shot-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install existing production HTTP client
        run: pip install requests==2.32.5
      - name: Observe ONE next-day public timetable via existing Worker
        env:
          STATUS_API_TOKEN: ${{ secrets.STATUS_API_TOKEN }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import re
          from zoneinfo import ZoneInfo
          import requests

          token = os.environ.get("STATUS_API_TOKEN", "").strip()
          if not token:
              print("SOURCE_PROBE token_missing; no request attempted")
              raise SystemExit(0)
          base = "https://cgv-alert-trigger.choi1101jh.workers.dev"
          auth = {"Authorization": "Bearer " + token}
          try:
              # Existing Production uses requests.post to this same route.
              runtime = requests.post(
                  base + "/api/runtime-check", json={}, headers=auth, timeout=15)
              try:
                  runtime_json = runtime.json()
              except ValueError:
                  runtime_json = {}
              print("ROUTE_DIAG " + json.dumps({
                  "runtime_http": runtime.status_code,
                  "runtime_has_worker_json": bool(
                      runtime_json.get("version") and
                      "browser_binding" in runtime_json),
                  "browser_binding": runtime_json.get("browser_binding"),
              }))
              if runtime.status_code != 200:
                  print("SOURCE_PROBE worker_not_reachable; no CGV request attempted")
                  raise SystemExit(0)

              date = (datetime.datetime.now(ZoneInfo("Asia/Seoul")).date() +
                      datetime.timedelta(days=1)).strftime("%Y%m%d")
              result = requests.post(
                  base + "/api/browser-check",
                  headers=auth,
                  json={"site_no":"0128", "site_name":"울산삼산", "play_ymd":date},
                  timeout=40,
              )
              try:
                  body = result.json()
              except ValueError:
                  body = {}
              value = str(body.get("text") or "")
              times = re.findall(r"(?<!\\d)(?:[01]?\\d|2[0-3]):[0-5]\\d(?!\\d)", value)
              candidate = (
                  result.status_code == 200 and body.get("ok") is True
                  and "울산삼산" in value and bool(times)
                  and bool(re.search(r"잔여|좌석|\\d\\s*석", value))
              )
              print("SOURCE_PROBE " + json.dumps({
                  "probe": "browser_content_candidate" if candidate else "unqualified",
                  "date": date, "http_status": result.status_code,
                  "source": body.get("source"),
                  "time_tokens": len(times),
                  "has_cinema": "울산삼산" in value,
                  "browser_ms": body.get("browser_ms"),
                  "reason": str(body.get("error") or "")[:180],
                  "response_is_worker_json": isinstance(body.get("ok"), bool),
                  "note": "Text match is NOT verified bookability",
              }, ensure_ascii=False))
          except requests.RequestException as exc:
              print("SOURCE_PROBE transport_failure " + type(exc).__name__)
          PY
