name: CGV Legacy Public Endpoint Probe

on:
  push:
    branches: [main]
    paths:
      - "poc_legacy_public_schedule.py"
      - ".github/workflows/cgv-legacy-public-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Test public endpoints without access bypass
        run: python poc_legacy_public_schedule.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cgv-legacy-public-probe
          path: cgv_legacy_public_probe_result.json
          retention-days: 7
