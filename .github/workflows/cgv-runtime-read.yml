name: CGV runtime read-only verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/cgv-runtime-read.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Read real deployed Worker and D1 configuration
        env:
          STATUS_API_TOKEN: ${{ secrets.STATUS_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, requests
          from pathlib import Path
          token = os.environ.get("STATUS_API_TOKEN", "").strip()
          if not token:
              raise SystemExit("STATUS_API_TOKEN unavailable; no runtime claim")
          response = requests.post(
              "https://cgv-alert-trigger.choi1101jh.workers.dev/api/runtime-check",
              json={}, headers={"Authorization": "Bearer " + token}, timeout=20,
          )
          response.raise_for_status()
          data = response.json()
          result = {key: data.get(key) for key in [
              "version", "now", "browser_binding", "cron_dispatch_first",
              "emergency_config", "source_takeover", "emergency_fallback",
          ]}
          Path("worker_runtime_latest.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          config = result.get("emergency_config") or {}
          print("REAL_WORKER_RUNTIME", json.dumps(result, ensure_ascii=False))
          assert data.get("ok") is True and str(data.get("version")) == "24"
          assert config.get("status_present") is True
          assert config.get("target_count") == 2 and config.get("eligible_priority_count") == 2
          print("WORKER_CONFIG_VERIFIED: actual collection health is separate")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cgv-worker-runtime
          path: worker_runtime_latest.json
          retention-days: 7
